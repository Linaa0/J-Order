services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jorder
      POSTGRES_PASSWORD: jorderpass
      POSTGRES_DB: jorder
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jorder -d jorder"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
